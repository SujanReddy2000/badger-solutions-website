name: Add leadership About Us section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-leadership-about.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject premium leadership section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-badger-leadership="v1"'
          if marker in s:
              print('Leadership section already present')
              raise SystemExit(0)

          css = r'''
          /* Badger Solutions Leadership About Us */
          .leadership-about{position:relative;overflow:hidden;background:linear-gradient(180deg,#050505 0%,#090909 48%,#050505 100%);border-block:1px solid var(--line)}
          .leadership-about::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-220px;top:12%;background:rgba(200,248,8,.07);filter:blur(110px);pointer-events:none}
          .leadership-head{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:end;margin-bottom:70px}
          .leadership-head .lead{justify-self:end}
          .leaders{display:grid;gap:42px}
          .leader{--shift:70px;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);min-height:540px;border:1px solid rgba(255,255,255,.09);border-radius:32px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 30px 90px rgba(0,0,0,.28);opacity:0;transform:translate3d(0,var(--shift),0) scale(.94);transition:opacity .85s ease,transform 1.05s cubic-bezier(.2,.7,.2,1),border-color .45s ease}
          .leader:nth-child(even){grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr)}
          .leader:nth-child(even) .leader-media{order:2}.leader:nth-child(even) .leader-copy{order:1}
          .leader.is-visible{opacity:1;transform:translate3d(0,0,0) scale(1)}
          .leader:hover{border-color:rgba(200,248,8,.42)}
          .leader-media{position:relative;min-height:540px;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(200,248,8,.16),transparent 38%),#0c0c0c}
          .leader-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(5,5,5,.78));pointer-events:none}
          .leader-photo{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.08) translate3d(0,var(--leader-parallax,0px),0);transition:transform .2s linear;filter:saturate(.9) contrast(1.03)}
          .leader-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:radial-gradient(circle at center,rgba(200,248,8,.12),transparent 45%)}
          .leader-monogram{font-size:clamp(5rem,13vw,10rem);font-weight:950;letter-spacing:-.08em;color:var(--lime);opacity:.92;text-shadow:0 0 45px rgba(200,248,8,.16)}
          .leader-copy{position:relative;display:flex;flex-direction:column;justify-content:center;padding:clamp(38px,6vw,76px);z-index:2}
          .leader-index{color:var(--lime);font-size:.76rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:34px}
          .leader-kicker{font-size:.86rem;color:#a7a7a7;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin-bottom:10px}
          .leader-name{font-size:clamp(2.8rem,6vw,6rem);line-height:.88;letter-spacing:-.065em;text-transform:uppercase;margin:0;max-width:720px}
          .leader-name .accent{color:var(--lime);display:block}
          .leader-role{display:inline-flex;align-items:center;align-self:flex-start;gap:10px;margin-top:28px;padding:11px 17px;border:1px solid rgba(200,248,8,.36);border-radius:999px;background:rgba(200,248,8,.07);color:var(--lime);font-weight:850;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(14px)}
          .leader-role::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 15px rgba(200,248,8,.8)}
          .leader-desc{max-width:600px;margin-top:28px;color:#b2b2b2;font-size:1rem}
          @media(max-width:820px){.leadership-head{grid-template-columns:1fr;gap:18px;margin-bottom:42px}.leadership-head .lead{justify-self:start}.leader,.leader:nth-child(even){grid-template-columns:1fr;min-height:0}.leader:nth-child(even) .leader-media,.leader:nth-child(even) .leader-copy{order:initial}.leader-media{min-height:390px}.leader-copy{padding:36px 26px 42px}.leader-name{font-size:clamp(2.55rem,13vw,4.5rem)}.leader{--shift:42px;border-radius:24px}}
          @media(prefers-reduced-motion:reduce){.leader{opacity:1;transform:none;transition:none}.leader-photo{transform:scale(1.03);transition:none}}
          '''

          html = r'''
          <section class="leadership-about" id="about" data-badger-leadership="v1" aria-labelledby="leadership-title">
            <div class="container">
              <div class="leadership-head">
                <div>
                  <span class="eyebrow">About Us · Leadership</span>
                  <h2 id="leadership-title">Built with vision.<br><span class="lime">Led with purpose.</span></h2>
                </div>
                <p class="lead">Meet the leadership shaping Badger Solutions — combining business vision, financial discipline and a long-term commitment to meaningful digital growth.</p>
              </div>
              <div class="leaders">
                <article class="leader" data-leader>
                  <div class="leader-media" aria-label="DEREDDY AKASH REDDY portrait area">
                    <div class="leader-placeholder" aria-hidden="true"><span class="leader-monogram">AR</span></div>
                  </div>
                  <div class="leader-copy">
                    <span class="leader-index">01 · Founder</span>
                    <span class="leader-kicker">DEREDDY</span>
                    <h3 class="leader-name"><span class="accent">AKASH</span> REDDY</h3>
                    <span class="leader-role">Founder</span>
                    <p class="leader-desc">Leads the vision behind Badger Solutions, building a modern digital company focused on strong creative execution, technology and measurable business growth.</p>
                  </div>
                </article>
                <article class="leader" data-leader>
                  <div class="leader-media" aria-label="DEREDDY BHAVANA portrait area">
                    <div class="leader-placeholder" aria-hidden="true"><span class="leader-monogram">DB</span></div>
                  </div>
                  <div class="leader-copy">
                    <span class="leader-index">02 · Leadership</span>
                    <span class="leader-kicker">DEREDDY</span>
                    <h3 class="leader-name"><span class="accent">BHAVANA</span></h3>
                    <span class="leader-role">CFO · Chief Financial Officer</span>
                    <p class="leader-desc">Drives financial strategy, planning and operational discipline with a long-term focus on sustainable growth and responsible business management.</p>
                  </div>
                </article>
              </div>
            </div>
          </section>
          '''

          js = r'''
          <script data-badger-leadership-motion="v1">
          (()=>{const leaders=[...document.querySelectorAll('[data-leader]')];if(!leaders.length)return;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce){leaders.forEach(x=>x.classList.add('is-visible'));return;}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('is-visible')}),{threshold:.18,rootMargin:'0px 0px -8%'});leaders.forEach(x=>io.observe(x));let ticking=false;const move=()=>{leaders.forEach(x=>{const r=x.getBoundingClientRect(),p=Math.max(-1,Math.min(1,(innerHeight/2-(r.top+r.height/2))/innerHeight));x.style.setProperty('--leader-parallax',`${p*18}px`)});ticking=false};addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(move);ticking=true}},{passive:true});move()})();
          </script>
          '''

          if '</style>' not in s or '</main>' not in s or '</body>' not in s:
              raise SystemExit('Expected HTML anchors not found; refusing unsafe edit')
          s = s.replace('</style>', css + '\n  </style>', 1)
          s = s.replace('</main>', html + '\n  </main>', 1)
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit leadership section
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Badger Solutions Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add premium About Us leadership section"
          git push
